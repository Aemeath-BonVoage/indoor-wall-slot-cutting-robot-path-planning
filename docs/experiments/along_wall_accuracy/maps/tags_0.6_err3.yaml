# 实验用标记地图（room.world 中 ID 0–5 的子集；u 相对参考标记 ID 0，面向墙面向右为正）
# 间距 0.6 m，地图记录的位置有误差：ID 2 记为 +3 mm、ID 4 记为 −3 mm（世界中的标记位置不变，等价于粘贴误差）
tag_map:
  family: tag36h11
  size: 0.1
  reference_id: 0
  sigma_position: 0.002
  tags:
  - {id: 0, u: 0.0, v: 0.7}
  - {id: 2, u: 0.603, v: 0.7}
  - {id: 4, u: 1.197, v: 0.7}
