# 伸缩-旋转-伸出动作示例
# 演示如何在切割点进行伸缩、旋转等复杂动作

points:
  # 1. 起始点（稍微伸出）
  - {x: 0.545, y: 0.000, z: 0.507, rotation: 0}
  
  # 2. 缩回（只改变X）
  - {x: 0.520, y: 0.000, z: 0.507, rotation: 0}
  
  # 3. 旋转45度（只改变rotation）
  - {x: 0.520, y: 0.000, z: 0.507, rotation: 45}
  
  # 4. 再次伸出（只改变X）
  - {x: 0.545, y: 0.000, z: 0.507, rotation: 45}
  
  # 5. 继续旋转到90度（只改变rotation）
  - {x: 0.545, y: 0.000, z: 0.507, rotation: 90}
  
  # 6. 缩回
  - {x: 0.520, y: 0.000, z: 0.507, rotation: 90}
  
  # 7. 旋转回0度
  - {x: 0.520, y: 0.000, z: 0.507, rotation: 0}
  
  # 8. 伸出到原位
  - {x: 0.545, y: 0.000, z: 0.507, rotation: 0}

motion:
  duration: 2.5
  return_home: true
