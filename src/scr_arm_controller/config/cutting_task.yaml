# 切割任务配置文件示例
# 坐标相对于 base_link

# 工作空间范围参考：
# X: [0.492, 0.582] m
# Y: [-0.080, 0.060] m  
# Z: [0.157, 0.707] m
# 初始位置: X=0.537m, Y≈0m, Z=0.507m

# 四个切割点的坐标和旋转角度
# rotation 单位为度，控制 joint4
points:
  - {x: 0.537, y: -0.025, z: 0.482, rotation: 0}
  - {x: 0.537, y: 0.025, z: 0.482, rotation: 0}
  - {x: 0.537, y: 0.025, z: 0.532, rotation: 0}
  - {x: 0.537, y: -0.025, z: 0.532, rotation: 0}

# 运动参数（可选）
motion:
  duration: 3.0       # 每段运动的持续时间（秒）
  return_home: true   # 完成后是否回到初始位置
