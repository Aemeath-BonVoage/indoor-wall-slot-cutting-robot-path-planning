# 复杂动作序列示例
# 演示：伸出 -> 切割 -> 缩回 -> 旋转 -> 伸出 -> 切割

points:
  # 1. 伸出到工作位置
  - {x: 0.550, y: 0.000, z: 0.507, rotation: 0}
  
  # 2-5. 在伸出位置画矩形（只改变Y和Z）
  - {x: 0.550, y: -0.025, z: 0.482, rotation: 0}
  - {x: 0.550, y: 0.025, z: 0.482, rotation: 0}
  - {x: 0.550, y: 0.025, z: 0.532, rotation: 0}
  - {x: 0.550, y: -0.025, z: 0.532, rotation: 0}
  
  # 6. 回到矩形起点
  - {x: 0.550, y: -0.025, z: 0.482, rotation: 0}
  
  # 7. 缩回（只改变X，回到接近初始位置）
  - {x: 0.537, y: -0.025, z: 0.482, rotation: 0}
  
  # 8. 旋转末端90度（只改变rotation）
  - {x: 0.537, y: -0.025, z: 0.482, rotation: 90}
  
  # 9. 再次伸出
  - {x: 0.550, y: -0.025, z: 0.482, rotation: 90}
  
  # 10-13. 在新角度下画另一个矩形
  - {x: 0.550, y: -0.025, z: 0.507, rotation: 90}
  - {x: 0.550, y: 0.025, z: 0.507, rotation: 90}
  - {x: 0.550, y: 0.025, z: 0.532, rotation: 90}
  - {x: 0.550, y: -0.025, z: 0.532, rotation: 90}

motion:
  duration: 2.0
  return_home: true
