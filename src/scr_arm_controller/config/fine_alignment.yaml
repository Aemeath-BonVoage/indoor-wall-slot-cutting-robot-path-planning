# 精对位参数（技能服务器 task_skills 与 alignment_benchmark 等实验脚本的节点参数）
#   ros2 launch scr_bringup sim_nav.launch.py alignment_params:=<本文件或 teach_alignment_offset 的输出>
#   ros2 run scr_arm_controller alignment_benchmark --ros-args --params-file <同上>
# 设计与控制律分析见 docs/experiments/fine_alignment/README.md
/**:
  ros__parameters:
    alignment:
      detector: apriltag          # apriltag | blob（第一版色块检测器，基线）
      tag_family: tag36h11
      tag_id: 0
      tag_size: 0.10              # 黑框边长（米）
      # 零位标定偏置（参考位姿处“估计值 − 真值”，测量模型内扣除）；由
      # teach_alignment_offset 示教得到，默认 0
      offset_normal: 0.0          # 米
      offset_lateral: 0.0         # 米，面向墙面向右为正
      offset_yaw_deg: 0.0         # 度，逆时针为正
      # 收敛判据：误差在容差内、底盘静止（< 3 mm/s、< 0.3°/s）、σ < 2 mm，连续 settle_cycles 周期
      tolerance_normal: 0.002
      tolerance_lateral: 0.002
      tolerance_yaw_deg: 0.3
      settle_cycles: 10
      # 控制律（平方根整形饱和比例律，见 docking_control.py）
      control_rate: 20.0          # Hz
      k_lin: 2.0                  # 1/s
      k_ang: 2.0                  # 1/s
      decel_lin: 0.15             # m/s²
      decel_ang: 0.5              # rad/s²
      max_lin: 0.15               # m/s
      max_ang: 0.3                # rad/s
      timeout: 50.0               # s（仿真时间）
      lost_timeout: 10.0          # s，标记持续丢失则判定失败
      sigma_hold: 0.01            # m，σ_u 超过该值时停车等待标记
      # 多站执行：true = 以 EKF 估计的标记位置为墙面坐标原点（停车残差计入）；
      # false = 以精对位停车位姿为原点（第一版语义）
      fold_residual: true
      # 多站执行：站间横移与到站残差测量时，视野内的定位标记继续参与沿墙位置更新
      # （false = 站间沿墙位置只用里程计外推）
      strafe_tag_updates: true
      # 横移前机械臂回观测位姿，使墙上的标记在画面内（只在 strafe_tag_updates 时生效）
      observe_between_stations: true
      # 标记地图（相对路径按本包 config 目录解析；空串 = 只有 tag_id 一个标记）。
      # 格式见 scr_arm_controller/tag_map.py，世界中的标记由 scr_description 的
      # scripts/generate_apriltag_model.py 生成
      tag_map: tag_map.yaml
      # 横移比例修正 s 作为 EKF 的第四个状态在线估计（真实横移 = (1 + s)·里程计横移）
      estimate_scale: true
      scale_init: 0.0             # s 的先验（可填离线标定值）
      scale_sigma: 0.05           # s 的先验标准差
      # 标记地图在线估计（tag_map_slam.py）：非参考标记的沿墙位置作为 EKF 状态，地图中的
      # 位置只作先验；false = 地图位置视为已知常数（默认）
      estimate_tag_map: false
      tag_map_prior_sigma: 0.0    # 先验标准差（米）；0 = 用地图中每个标记的 sigma
      tag_map_output: ''          # 估计（均值 + 协方差）写入的地图 YAML，可作下一遍的 tag_map
      tag_map_floor: 0.0          # 导出协方差中计入的相机系统误差（米，1σ）
      # 实验与对比见 docs/experiments/along_wall_accuracy/README.md
