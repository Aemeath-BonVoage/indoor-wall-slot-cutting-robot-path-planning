# 在目标点(8.61277, -2.01879)执行的切割任务
# 完整任务配置：导航 + 精确定位 + 切割

# 导航目标
navigation:
  x: 8.61277
  y: -2.01879
  yaw: -1.64894  # 弧度

# 精确定位参数
precise_positioning:
  enabled: true
  mode: visual                # visual = AprilTag + 激光 EKF（第二版）；visual_v1 = 色块 + PBVS（第一版）；odom = 里程计 + 已知标记坐标
  distance_from_marker: 0.70  # 距离黄色方块的目标距离（米）
  position_tolerance: 0.01    # 位置容差（米）
  angle_tolerance_deg: 1.0    # 角度容差（度）
  observe_joint1: -0.15       # visual 模式下滑台高度（米），使方块成像在机械臂遮挡区域之上

# 扫描 / 切割期间底盘定点保持（机械臂反作用力会推动底盘；false 时只测量漂移）
base_hold: true

# 方块扫描参数
scanning:
  enabled: true
  z_start: 0.3    # 扫描起始高度（米）
  z_end: 0.7      # 扫描结束高度（米）
  z_step: 0.05    # 扫描步进（米）

# 切割任务 - 墙面切割（可以是任意数量的点，至少2个）
# 示例1：4个点的矩形
points:
  - {x: 0.520, y: 0.000, z: 0.507, rotation: 0}
  - {x: 0.520, y: 0.0, z: 0.532, rotation: 0}
  - {x: 0.550, y: 0.0, z: 0.532, rotation: 0}
  - {x: 0.550, y: 0.0, z: 0.482, rotation: 0} #
  - {x: 0.520, y: 0.0, z: 0.482, rotation: 0}
  - {x: 0.520, y: 0.0, z: 0.482, rotation: 90}
  - {x: 0.550, y: 0.0, z: 0.482, rotation: 90}
  - {x: 0.550, y: 0.055, z: 0.482, rotation: 90} #
  - {x: 0.520, y: 0.055, z: 0.482, rotation: 90}
  - {x: 0.520, y: 0.055, z: 0.482, rotation: 0}
  - {x: 0.550, y: 0.055, z: 0.482, rotation: 0}
  - {x: 0.550, y: 0.055, z: 0.532, rotation: 0} #
  - {x: 0.520, y: 0.055, z: 0.532, rotation: 0}
  - {x: 0.520, y: 0.055, z: 0.532, rotation: 90}
  - {x: 0.550, y: 0.055, z: 0.532, rotation: 90} # 
  - {x: 0.550, y: 0.0, z: 0.532, rotation: 90}
  - {x: 0.520, y: 0.0, z: 0.532, rotation: 90}
motion:
  duration: 2.0
  return_home: true
  # 空切间隙（米）：Gazebo 墙为刚体无法切入，刀具最深处停在墙前该距离，只验证轨迹位置。
  # 真机上删去此项，按切割点切入墙面。
  dry_run_gap: 0.005
