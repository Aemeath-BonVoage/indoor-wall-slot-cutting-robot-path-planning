controller_manager:
  ros__parameters:
    update_rate: 1000

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    wheel_controller:
      type: forward_command_controller/ForwardCommandController

    # 底盘（base_control:=ros2_control）：麦克纳姆控制器，见 scr_base_control
    base_controller:
      type: scr_base_control/MecanumDriveController

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50.0

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
    
    command_interfaces:
      - position
    
    state_interfaces:
      - position
      - velocity
    
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    
    allow_partial_joints_goal: false
    open_loop_control: false
    
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

wheel_controller:
  ros__parameters:
    joints:
      - joint_lf_link
      - joint_rf_link
      - joint_lb_link
      - joint_rb_link
    interface_name: velocity

# 麦克纳姆底盘控制器：cmd_vel → 轮速命令，轮速状态 → 轮式里程计
# 与 robot_localization 融合时由 scr_base_control/config/base_controller_ekf.yaml 改为
# 只发布 /wheel/odom、不发布 TF
base_controller:
  ros__parameters:
    wheel_names: [joint_lf_link, joint_rf_link, joint_lb_link, joint_rb_link]
    wheel_radius: 0.05
    wheel_separation_x: 0.59316
    wheel_separation_y: 0.4938
    cmd_vel_timeout: 0.5
    cmd_vel_topic: /cmd_vel
    odom_topic: /odom
    enable_odom_tf: true
    publish_rate: 50.0
    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.004, 1000000.0, 1000000.0, 1000000.0, 0.004]
