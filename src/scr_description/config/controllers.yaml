controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    # 控制器列表
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

# 关节状态广播器配置
joint_state_broadcaster:
  ros__parameters:
    {}

# 机械臂控制器配置
arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
    
    command_interfaces:
      - position
    
    state_interfaces:
      - position
      - velocity
    
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    
    allow_partial_joints_goal: false
    
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

# 麦克纳姆轮底盘控制器配置
mecanum_drive_controller:
  ros__parameters:
    # 四个轮子的关节名称
    front_left_wheel_joint: joint_lf_link
    front_right_wheel_joint: joint_rf_link
    rear_left_wheel_joint: joint_lb_link
    rear_right_wheel_joint: joint_rb_link
    
    # 机器人几何参数 (100mm麦轮)
    wheel_separation_x: 0.59316  # 前后轮距 (m) = 593.16mm
    wheel_separation_y: 0.4938   # 左右轮距 (m) = 493.80mm
    wheel_radius: 0.05           # 车轮半径 (m) = 50mm (100mm麦轮)
    
    # 坐标系设置
    odom_frame_id: odom
    base_frame_id: base_link
    
    # 发布设置
    publish_rate: 50.0
    enable_odom_tf: true
    
    # 命令超时
    cmd_vel_timeout: 0.5
    
    # 速度限制
    linear:
      x:
        has_velocity_limits: true
        has_acceleration_limits: true
        max_velocity: 1.0
        min_velocity: -1.0
        max_acceleration: 1.0
        min_acceleration: -1.0
      y:
        has_velocity_limits: true
        has_acceleration_limits: true
        max_velocity: 1.0
        min_velocity: -1.0
        max_acceleration: 1.0
        min_acceleration: -1.0
    
    angular:
      z:
        has_velocity_limits: true
        has_acceleration_limits: true
        max_velocity: 2.0
        min_velocity: -2.0
        max_acceleration: 2.0
        min_acceleration: -2.0
