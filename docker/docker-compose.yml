version: '3.3'

services:
  ros2-humble:
    build:
      context: .
      dockerfile: Dockerfile
    image: ros2-humble-dev
    container_name: ros2-humble-container
    stdin_open: true
    tty: true
    network_mode: host
    privileged: true
    volumes:
      - ../src:/workspace/src
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    devices:
      - /dev/dri:/dev/dri
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=1
      - LIBGL_ALWAYS_INDIRECT=0
    command: /bin/bash
